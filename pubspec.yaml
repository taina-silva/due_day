name: due_day
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.4 <4.0.0"

scripts:
  l10n: "flutter gen-l10n"
  builder: "flutter pub run build_runner build --delete-conflicting-outputs"
  builder_watch: "flutter pub run build_runner watch --delete-conflicting-outputs"
  # Security Scripts (Obfuscate Builds)
  build_apk_prod: "fvm flutter build apk --obfuscate --split-debug-info=build/app/outputs/symbols"
  build_bundle_prod: "fvm flutter build appbundle --obfuscate --split-debug-info=build/app/outputs/symbols"
  build_ios_prod: "fvm flutter build ipa --obfuscate --split-debug-info=build/app/outputs/symbols"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  flutter_local_notifications: ^22.0.1
  google_sign_in: ^7.2.0
  go_router: ^17.3.0
  dartz: ^0.10.1
  equatable: ^2.0.8
  uuid: ^4.5.3
  intl: ^0.20.2
  fpdart: ^1.2.0
  json_annotation: ^4.9.0
  timezone: ^0.11.0
  freezed_annotation: ^3.1.0
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  rxdart: ^0.28.0
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^3.2.5
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/logo/
  fonts:
    - family: Sofia Sans
      fonts:
        - asset: assets/fonts/SofiaSans-Regular.ttf
        - asset: assets/fonts/SofiaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/SofiaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SofiaSans-Bold.ttf
          weight: 700
